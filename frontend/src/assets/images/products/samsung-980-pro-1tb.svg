<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- M.2 PCB Board -->
  <rect x="50" y="110" width="300" height="80" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Gold connector notch -->
  <rect x="42" y="125" width="10" height="50" rx="2" fill="#eab308"/>
  <rect x="48" y="145" width="4" height="10" fill="#0f172a"/>
  <!-- Mounting semi-circle cutout -->
  <path d="M 350 140 A 10 10 0 0 0 350 160 Z" fill="#f8fafc"/>
  
  <!-- Samsung Controller Chip with Nickel coating -->
  <rect x="75" y="120" width="45" height="45" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="97" y="145" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">ELPIS</text>
  
  <!-- V-NAND Flash Chips -->
  <rect x="140" y="120" width="75" height="58" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="177" y="152" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">SAMSUNG</text>
  
  <rect x="235" y="120" width="75" height="58" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="272" y="152" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">V-NAND</text>
  
  <!-- Branding Label Ribbon -->
  <rect x="75" y="180" width="235" height="8" fill="#ef4444"/>
  <text x="200" y="225" font-family="sans-serif" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">SAMSUNG 980 PRO PCIe 4.0 NVMe</text>
  <text x="200" y="245" font-family="sans-serif" font-size="11" fill="#2563eb" font-weight="bold" text-anchor="middle">1TB - Up to 7000 MB/s</text>
</svg>
