<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- Gold Pins Bottom Module 1 -->
  <g fill="#eab308">
    <rect x="50" y="165" width="300" height="8" rx="1"/>
    <line x1="180" y1="165" x2="180" y2="173" stroke="#f8fafc" stroke-width="4"/>
  </g>
  <!-- RAM Stick 1 Heatsink -->
  <rect x="40" y="110" width="320" height="55" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="118" width="300" height="12" rx="2" fill="#1e293b"/>
  <!-- Aluminum heat spreader ridges -->
  <g fill="#334155">
    <rect x="60" y="136" width="6" height="20" rx="1"/>
    <rect x="75" y="136" width="6" height="20" rx="1"/>
    <rect x="90" y="136" width="6" height="20" rx="1"/>
    <rect x="305" y="136" width="6" height="20" rx="1"/>
    <rect x="320" y="136" width="6" height="20" rx="1"/>
    <rect x="335" y="136" width="6" height="20" rx="1"/>
  </g>
  <!-- Corsair Sails Icon / Text -->
  <rect x="130" y="134" width="140" height="24" rx="4" fill="#020617" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="150" font-family="sans-serif" font-size="11" fill="#f8fafc" font-weight="900" letter-spacing="2" text-anchor="middle">CORSAIR</text>
  <text x="200" y="127" font-family="sans-serif" font-size="8" fill="#38bdf8" font-weight="bold" letter-spacing="3" text-anchor="middle">VENGEANCE DDR5</text>
  
  <!-- Specs Badge -->
  <rect x="120" y="200" width="160" height="30" rx="6" fill="#1e293b"/>
  <text x="200" y="220" font-family="sans-serif" font-size="11" fill="#f8fafc" font-weight="bold" text-anchor="middle">32GB (2x16GB) 6000MHz</text>
</svg>
