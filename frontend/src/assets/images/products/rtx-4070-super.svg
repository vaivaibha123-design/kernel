<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gpuBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="heatsink">
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- Heatsink Fins -->
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.6">
    <line x1="50" y1="80" x2="50" y2="220" />
    <line x1="60" y1="80" x2="60" y2="220" />
    <line x1="70" y1="80" x2="70" y2="220" />
    <line x1="330" y1="80" x2="330" y2="220" />
    <line x1="340" y1="80" x2="340" y2="220" />
    <line x1="350" y1="80" x2="350" y2="220" />
  </g>
  <!-- GPU Shroud -->
  <rect x="40" y="70" width="320" height="160" rx="12" fill="url(#gpuBody)" stroke="#3b82f6" stroke-width="2"/>
  <!-- PCIe Bracket -->
  <rect x="25" y="60" width="15" height="180" rx="3" fill="#64748b"/>
  <rect x="20" y="55" width="20" height="10" rx="2" fill="#94a3b8"/>
  <!-- Fan 1 -->
  <circle cx="125" cy="150" r="55" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="125" cy="150" r="48" fill="none" stroke="url(#fanGlow)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="125" cy="150" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="154" font-family="sans-serif" font-size="9" fill="#93c5fd" font-weight="bold" text-anchor="middle">GEFORCE</text>
  <!-- Fan 2 -->
  <circle cx="275" cy="150" r="55" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="275" cy="150" r="48" fill="none" stroke="url(#fanGlow)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="275" cy="150" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="275" y="154" font-family="sans-serif" font-size="9" fill="#93c5fd" font-weight="bold" text-anchor="middle">RTX</text>
  <!-- Logo Bar -->
  <rect x="165" y="80" width="70" height="16" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="200" y="92" font-family="sans-serif" font-size="8" fill="#4ade80" font-weight="bold" text-anchor="middle">RTX 4070 SUPER</text>
  <!-- Heatpipes -->
  <path d="M 60 215 Q 120 225 200 215 T 340 215" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
</svg>
