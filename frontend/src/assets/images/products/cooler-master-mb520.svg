<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- PC Case MasterBox MB520 -->
  <rect x="120" y="30" width="160" height="240" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Tempered Glass Side Window -->
  <rect x="140" y="45" width="130" height="175" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <!-- 3 ARGB Front Fans -->
  <circle cx="130" cy="80" r="18" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="130" cy="140" r="18" fill="none" stroke="#a855f7" stroke-width="3"/>
  <circle cx="130" cy="200" r="18" fill="none" stroke="#ec4899" stroke-width="3"/>
  <!-- Front Mesh Grid -->
  <line x1="120" y1="40" x2="120" y2="240" stroke="#06b6d4" stroke-width="3"/>
  <!-- PSU Shroud -->
  <rect x="140" y="225" width="130" height="35" rx="2" fill="#020617"/>
  <text x="205" y="247" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">COOLER MASTER</text>
  <!-- GPU inside case -->
  <rect x="155" y="125" width="85" height="25" rx="3" fill="#334155" stroke="#3b82f6" stroke-width="1"/>
</svg>
