<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- PSU Box -->
  <rect x="70" y="60" width="260" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Fan Grille -->
  <circle cx="160" cy="150" r="58" fill="#020617" stroke="#475569" stroke-width="2"/>
  <circle cx="160" cy="150" r="48" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="160" cy="150" r="18" fill="#1e293b"/>
  <text x="160" y="154" font-family="sans-serif" font-size="7" fill="#eab308" font-weight="bold" text-anchor="middle">CORSAIR</text>
  <!-- Modular Ports -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="1">
    <rect x="245" y="80" width="30" height="14" rx="1"/>
    <rect x="285" y="80" width="30" height="14" rx="1"/>
    <rect x="245" y="105" width="30" height="14" rx="1"/>
    <rect x="285" y="105" width="30" height="14" rx="1"/>
    <rect x="245" y="130" width="70" height="16" rx="1"/>
    <rect x="245" y="160" width="70" height="18" rx="1"/>
  </g>
  <!-- 80 Plus Gold Badge -->
  <rect x="245" y="190" width="70" height="26" rx="4" fill="#ca8a04"/>
  <text x="280" y="206" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">80 PLUS GOLD</text>
  <!-- Model Text -->
  <text x="160" y="225" font-family="sans-serif" font-size="11" fill="#f8fafc" font-weight="800" text-anchor="middle">RM750e - 750W ATX 3.0</text>
</svg>
