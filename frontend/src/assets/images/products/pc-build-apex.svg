<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- Dual Chamber Glass Case (Lian Li style) -->
  <rect x="90" y="30" width="220" height="240" rx="10" fill="#09090b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="105" y="45" width="190" height="210" rx="6" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="1.5"/>
  
  <!-- Top 360mm Radiator with RGB Fans -->
  <rect x="115" y="55" width="170" height="15" rx="2" fill="#18181b"/>
  <circle cx="140" cy="72" r="10" fill="none" stroke="url(#neonMagenta)" stroke-width="2"/>
  <circle cx="200" cy="72" r="10" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>
  <circle cx="260" cy="72" r="10" fill="none" stroke="url(#neonMagenta)" stroke-width="2"/>
  
  <!-- CPU Liquid Cooler Pump Block with Screen -->
  <circle cx="200" cy="115" r="18" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="118" font-family="sans-serif" font-size="8" fill="#38bdf8" font-weight="bold" text-anchor="middle">48°C</text>
  
  <!-- Braided Liquid Tubing -->
  <path d="M 215 110 Q 240 90 260 72" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 120 Q 240 100 250 72" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- RAM Sticks with RGB Flow -->
  <rect x="235" y="100" width="4" height="35" rx="1" fill="#ec4899"/>
  <rect x="242" y="100" width="4" height="35" rx="1" fill="#06b6d4"/>

  <!-- RTX 4080 Super GPU with RGB Logo & Anti-Sag Bracket -->
  <rect x="125" y="150" width="150" height="40" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="140" y="158" width="55" height="12" rx="2" fill="#020617"/>
  <text x="167" y="167" font-family="sans-serif" font-size="7" fill="#22c55e" font-weight="bold" text-anchor="middle">GEFORCE RTX</text>
  <rect x="180" y="180" width="3" height="30" fill="#94a3b8"/>
  
  <!-- Bottom Intake Fans -->
  <circle cx="145" cy="235" r="12" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>
  <circle cx="200" cy="235" r="12" fill="none" stroke="url(#neonMagenta)" stroke-width="2"/>
  <circle cx="255" cy="235" r="12" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>
  
  <!-- Outer Glow Tag -->
  <rect x="125" y="275" width="150" height="18" rx="4" fill="#1e293b"/>
  <text x="200" y="287" font-family="sans-serif" font-size="9" fill="#f8fafc" font-weight="bold" text-anchor="middle">KERNEL APEX BEAST</text>
</svg>
