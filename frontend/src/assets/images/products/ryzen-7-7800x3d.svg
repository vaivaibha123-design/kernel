<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>
  <!-- Box Base -->
  <polygon points="120,70 280,70 320,110 80,110" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <rect x="80" y="110" width="240" height="130" fill="#0f172a" stroke="#f97316" stroke-width="2" rx="4"/>
  <!-- Orange Accent Triangle -->
  <polygon points="80,110 160,110 80,190" fill="#ea580c"/>
  <!-- Processor Window / IHS -->
  <rect x="140" y="125" width="120" height="95" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="148" y="133" width="104" height="79" rx="4" fill="#94a3b8"/>
  <text x="200" y="165" font-family="sans-serif" font-size="14" fill="#1e293b" font-weight="900" text-anchor="middle">AMD</text>
  <text x="200" y="185" font-family="sans-serif" font-size="12" fill="#ea580c" font-weight="bold" text-anchor="middle">RYZEN 7</text>
  <text x="200" y="198" font-family="sans-serif" font-size="9" fill="#0f172a" font-weight="bold" text-anchor="middle">7800X3D</text>
  <!-- 3D V-Cache Badge -->
  <rect x="235" y="85" width="70" height="18" rx="3" fill="#ea580c"/>
  <text x="270" y="98" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">3D V-CACHE</text>
  <!-- AM5 socket indicator -->
  <text x="110" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8" font-weight="600">SOCKET AM5</text>
  <text x="290" y="230" font-family="sans-serif" font-size="10" fill="#22c55e" font-weight="bold" text-anchor="end">PCIe 5.0 READY</text>
</svg>
