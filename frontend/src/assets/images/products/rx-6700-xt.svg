  <rect x="40" y="70" width="320" height="160" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="25" y="60" width="15" height="180" rx="3" fill="#64748b"/>
  <!-- Fan 1 -->
  <circle cx="125" cy="150" r="54" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
