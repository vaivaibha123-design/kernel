# ========================================================
# KERNEL BACKEND APPLICATION CONFIGURATION
# ========================================================

server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kernel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:V12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Jackson JSON Pretty Print
spring.jackson.serialization.indent-output=true

# Google Gemini API Key (Can be set via environment variable GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash

# Logging
logging.level.com.kernel=INFO
logging.level.org.springframework.web=INFO
